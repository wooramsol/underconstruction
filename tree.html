<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="An interactive 3D Christmas tree made of letters. Type any word in English or 한글 and the tree rebuilds from your letters in real time. By Ramsol Jeong (정우람솔, wooramsol).">
    <link rel="canonical" href="https://wooramsol.com/tree.html">
    <link rel="icon" href="favicon.png" type="image/png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Ramsol's Repository">
    <meta property="og:url" content="https://wooramsol.com/tree.html">
    <meta property="og:title" content="ASCII Christmas Tree — Ramsol Jeong (정우람솔)">
    <meta property="og:description" content="An interactive 3D Christmas tree made of letters. Type any word in English or 한글 and the tree rebuilds from your letters in real time. By Ramsol Jeong (정우람솔, wooramsol).">
    <meta property="og:image" content="https://wooramsol.com/og.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ASCII Christmas Tree — Ramsol Jeong (정우람솔)</title>
    <style>
        body {
            margin: 0;
            background: #010301;
            overflow: hidden;
            font-family: 'Courier New', monospace;
            touch-action: none; 
        }
        canvas { 
            display: block;
            width: 100%;
            height: 100%;
            outline: none;
        }
        #tree-text-wrap {
            position: fixed;
            left: 50%;
            bottom: max(24px, env(safe-area-inset-bottom));
            transform: translateX(-50%);
            z-index: 10;
            width: min(320px, calc(100vw - 40px));
        }
        #tree-text {
            width: 100%;
            box-sizing: border-box;
            padding: 10px 14px;
            font-size: 16px; /* 16px+ stops iOS from zooming on focus */
            font-family: inherit;
            text-align: center;
            color: #aaffaa;
            background: rgba(1, 3, 1, 0.75);
            border: 1px solid #0f400f;
            border-radius: 6px;
            outline: none;
        }
        #tree-text:focus { border-color: #aaffaa; }
        #tree-text::placeholder { color: #3f7f3f; }
    </style>
</head>
<body>
    <div id="tree-text-wrap"><input id="tree-text" type="text" placeholder="RAMSOL" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" aria-label="Letters for the tree"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        let scene, camera, renderer, treeGroup, starGroup, controls;
        let treeItems = [];          // fixed positions/colors; only the letters change
        let treeMeshes = [];
        let starMeshes = [];
        const glyphTextures = {};

        const DEFAULT_CHARS = ['R', 'A', 'M', 'S', 'O', 'L', '*'];
        const MAX_INPUT = 30;

        const BG_COLOR = new THREE.Color(0x010301);
        const COLOR_BOTTOM = new THREE.Color(0x0f400f);
        const COLOR_TOP = new THREE.Color(0xaaffaa);
        const STAR_COLOR_YELLOW = new THREE.Color(0xffff00);
        const STAR_COLOR_WHITE = new THREE.Color(0xffffff);

        function init() {
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x010301, 0.035);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0.5, 14);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setClearColor(BG_COLOR, 1);
            document.body.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.enablePan = true;
            controls.screenSpacePanning = true;
            controls.mouseButtons = { LEFT: THREE.MOUSE.ROTATE, MIDDLE: THREE.MOUSE.PAN, RIGHT: THREE.MOUSE.DOLLY };
            controls.touches = { ONE: THREE.TOUCH.ROTATE, TWO: THREE.TOUCH.DOLLY_PAN };
            controls.minDistance = 5;
            controls.maxDistance = 30;

            treeGroup = new THREE.Group();
            treeGroup.position.y = 0.8;
            scene.add(treeGroup);

            createTreeLayout();
            setTreeText(initialText());
            createOptimizedStar();
            setupInput();
            animate();

            window.addEventListener('resize', onResize);
        }

        // ---- Letters are drawn onto small canvases with the device's own fonts, so any
        //      language works (English, 한글, even emoji). Each distinct letter = one draw call.
        function glyphTexture(char) {
            if (glyphTextures[char]) return glyphTextures[char];
            const S = 128;
            const c = document.createElement('canvas');
            c.width = c.height = S;
            const g = c.getContext('2d');
            g.fillStyle = '#fff';
            g.textAlign = 'center';
            g.textBaseline = 'middle';
            g.font = `bold ${S * 0.82}px "Helvetica Neue", Arial, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif`;
            g.fillText(char, S / 2, S / 2 + S * 0.04);
            const tex = new THREE.CanvasTexture(c);
            tex.minFilter = THREE.LinearMipMapLinearFilter;
            tex.anisotropy = 4;
            glyphTextures[char] = tex;
            return tex;
        }

        const planeGeo = new THREE.PlaneGeometry(1, 1);
        const _m = new THREE.Matrix4(), _q = new THREE.Quaternion(), _p = new THREE.Vector3(), _s = new THREE.Vector3();
        const UP = new THREE.Vector3(0, 1, 0);

        function buildInstanced(parent, items) {
            // items: [{char, x, y, z, rotY, size, color}] -> one InstancedMesh per distinct char
            const byChar = new Map();
            items.forEach((it) => { if (!byChar.has(it.char)) byChar.set(it.char, []); byChar.get(it.char).push(it); });
            const meshes = [];
            byChar.forEach((list, char) => {
                const mat = new THREE.MeshBasicMaterial({ map: glyphTexture(char), color: 0xffffff, alphaTest: 0.35, side: THREE.DoubleSide });
                const mesh = new THREE.InstancedMesh(planeGeo, mat, list.length);
                list.forEach((it, i) => {
                    _p.set(it.x, it.y, it.z);
                    _q.setFromAxisAngle(UP, it.rotY || 0);
                    _s.set(it.size, it.size, it.size);
                    _m.compose(_p, _q, _s);
                    mesh.setMatrixAt(i, _m);
                    mesh.setColorAt(i, it.color);
                });
                mesh.instanceMatrix.needsUpdate = true;
                mesh.instanceColor.needsUpdate = true;
                mesh.userData.items = list;
                parent.add(mesh);
                meshes.push(mesh);
            });
            return meshes;
        }

        function disposeMeshes(list) {
            list.forEach((m) => { m.parent && m.parent.remove(m); m.material.dispose(); m.dispose && m.dispose(); });
        }

        // Positions and colors are generated once; typing only swaps which letter each spot shows.
        function createTreeLayout() {
            const isMobile = Math.min(window.innerWidth, window.innerHeight) < 600;
            const particleCount = isMobile ? 7000 : 10000;
            const treeHeight = 8.5;
            const maxRadius = 4.0;
            treeItems = [];

            for (let i = 0; i < particleCount; i++) {
                const heightDistribution = Math.pow(Math.random(), 2.0);
                if (heightDistribution < 0.15 && Math.random() > heightDistribution * 4.0) continue;

                const y = (heightDistribution * treeHeight) - (treeHeight / 2);
                const baseConeRadius = maxRadius * (1 - heightDistribution);
                const theta = Math.random() * Math.PI * 2;

                let spikeFactor = 1.0;
                if (Math.random() > 0.7) {
                    spikeFactor = (0.9 + Math.random() * 0.2) + (Math.random() * 0.5 * (1.0 - heightDistribution));
                }
                const r = baseConeRadius * Math.sqrt(Math.random()) * spikeFactor;
                const size = (0.11 + Math.random() * 0.02) * 1.25; // plane is a bit larger than the glyph itself

                let alpha = THREE.MathUtils.smoothstep(heightDistribution, 0.0, 0.25);
                alpha = 0.1 + alpha * 0.9;
                const color = COLOR_BOTTOM.clone().lerp(COLOR_TOP, heightDistribution);
                color.lerp(BG_COLOR, 1.0 - alpha);
                const hsl = {};
                color.getHSL(hsl);
                hsl.h += (Math.random() - 0.5) * 0.08;
                hsl.s += (Math.random() - 0.5) * 0.5;
                hsl.l += 0.1 + (Math.random() - 0.5) * 0.6 * alpha;
                color.setHSL(hsl.h, hsl.s, hsl.l);
                color.lerp(BG_COLOR, 1.0 - alpha);

                treeItems.push({ char: 'R', x: Math.cos(theta) * r, y, z: Math.sin(theta) * r, rotY: -theta, size, color, pick: Math.random() });
            }
        }

        function textToChars(text) {
            const chars = Array.from((text || '').replace(/\s+/g, '')).slice(0, MAX_INPUT);
            return chars.length ? chars : DEFAULT_CHARS;
        }

        function setTreeText(text) {
            const chars = textToChars(text);
            treeItems.forEach((it) => { it.char = chars[Math.floor(it.pick * chars.length)]; });
            disposeMeshes(treeMeshes);
            treeMeshes = buildInstanced(treeGroup, treeItems);
        }

        function createOptimizedStar() {
            starGroup = new THREE.Group();
            const centerY = 4.8, outerRadius = 0.65, innerRadius = 0.28, thicknessFactor = 0.15;
            const vertices = [];
            for (let i = 0; i < 10; i++) {
                const angle = (Math.PI / 2) + (i * Math.PI / 5);
                const r = (i % 2 === 0) ? outerRadius : innerRadius;
                vertices.push({ x: Math.cos(angle) * r, y: centerY + Math.sin(angle) * r });
            }
            const items = [];
            let attempts = 0;
            while (items.length < 600 && attempts < 10000) {
                attempts++;
                const rx = (Math.random() - 0.5) * 2 * outerRadius;
                const ry = centerY + (Math.random() - 0.5) * 2 * outerRadius;
                if (!isPointInPolygon(rx, ry, vertices)) continue;
                const distRatio = Math.sqrt(rx * rx + (ry - centerY) * (ry - centerY)) / outerRadius;
                const rz = (Math.random() - 0.5) * 2 * (1.0 - distRatio) * thicknessFactor;
                const size = (0.08 + (1.0 - distRatio) * 0.06 + Math.random() * 0.04) * 1.3;
                const color = (Math.random() > 0.05) ? STAR_COLOR_YELLOW.clone() : STAR_COLOR_WHITE.clone();
                const hsl = {};
                color.getHSL(hsl);
                // random facing so the flat glyphs never all turn edge-on together while the star spins
                items.push({ char: '*', x: rx, y: ry, z: rz, rotY: Math.random() * Math.PI, size, color, hsl });
            }
            starMeshes = buildInstanced(starGroup, items);
            treeGroup.add(starGroup);
        }

        function isPointInPolygon(x, y, vs) {
            let inside = false;
            for (let i = 0, j = vs.length - 1; i < vs.length; j = i++) {
                const xi = vs[i].x, yi = vs[i].y, xj = vs[j].x, yj = vs[j].y;
                if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) inside = !inside;
            }
            return inside;
        }

        // ---- Text field: live rebuild while typing; the text is kept in the URL (?text=) so a tree can be shared.
        function initialText() {
            try { return new URLSearchParams(location.search).get('text') || ''; } catch (e) { return ''; }
        }

        function setupInput() {
            const input = document.getElementById('tree-text');
            input.maxLength = MAX_INPUT * 2;
            input.value = initialText();
            let timer = 0;
            const apply = () => {
                setTreeText(input.value);
                try {
                    const url = new URL(location.href);
                    if (input.value.trim()) url.searchParams.set('text', input.value.trim());
                    else url.searchParams.delete('text');
                    history.replaceState(null, '', url);
                } catch (e) {}
            };
            // 'input' fires per keystroke; for Korean IME also on composition updates, so 한글 grows live too
            input.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(apply, 120); });
            // keep the 3D controls from reacting while typing
            ['pointerdown', 'touchstart', 'keydown'].forEach((e) => input.addEventListener(e, (ev) => ev.stopPropagation()));
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            treeGroup.rotation.y += 0.008;

            if (starGroup) {
                starGroup.rotation.y -= 0.016;
                const time = Date.now() * 0.004;
                const c = new THREE.Color();
                let index = 0;
                starMeshes.forEach((mesh) => {
                    mesh.userData.items.forEach((it, i) => {
                        const flash = Math.pow(Math.abs(Math.sin(time * 0.7 + index++ * 0.5)), 5);
                        c.setHSL(it.hsl.h, it.hsl.s, Math.min(1.0, flash * 3.0));
                        mesh.setColorAt(i, c);
                    });
                    mesh.instanceColor.needsUpdate = true;
                });
            }

            renderer.render(scene, camera);
        }

        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        }

        init(); // run after all declarations above

        // --- Christmas music: "We Wish You a Merry Christmas" (public-domain melody, WebAudio chiptune) ---
        const music = (() => {
            const N = { D4: 293.66, E4: 329.63, Fs4: 369.99, G4: 392.0, A4: 440.0, B4: 493.88, C5: 523.25 };
            // [frequency, beats] in 3/4 time
            const MELODY = [
                [N.D4, 1],
                [N.G4, 1], [N.G4, 0.5], [N.A4, 0.5], [N.G4, 0.5], [N.Fs4, 0.5],
                [N.E4, 1], [N.E4, 1], [N.E4, 1],
                [N.A4, 1], [N.A4, 0.5], [N.B4, 0.5], [N.A4, 0.5], [N.G4, 0.5],
                [N.Fs4, 1], [N.Fs4, 1], [N.D4, 1],
                [N.B4, 1], [N.B4, 0.5], [N.C5, 0.5], [N.B4, 0.5], [N.A4, 0.5],
                [N.G4, 1], [N.E4, 1], [N.D4, 0.5], [N.D4, 0.5],
                [N.E4, 1], [N.A4, 1], [N.Fs4, 1],
                [N.G4, 2], [0, 1.5]
            ];
            const BEAT = 0.34;
            let ctx = null;
            let playing = false;
            let loopTimer = null;

            function note(t, freq, beats) {
                if (!freq) return;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.value = freq;
                const dur = beats * BEAT;
                gain.gain.setValueAtTime(0, t);
                gain.gain.linearRampToValueAtTime(0.16, t + 0.02);
                gain.gain.exponentialRampToValueAtTime(0.001, t + dur * 0.95);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(t);
                osc.stop(t + dur);
            }

            function scheduleMelody() {
                let t = ctx.currentTime + 0.02;
                for (const [f, b] of MELODY) {
                    note(t, f, b);
                    t += b * BEAT;
                }
                loopTimer = setTimeout(() => { if (playing) scheduleMelody(); }, (t - ctx.currentTime - 0.2) * 1000);
            }

            return {
                get playing() { return playing; },
                start() {
                    if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
                    const begin = () => {
                        if (playing) return;
                        playing = true;
                        scheduleMelody();
                    };
                    // Safari: only schedule notes once the context is actually running,
                    // otherwise pre-scheduled notes resume late/unreliably.
                    if (ctx.state === 'running') {
                        begin();
                    } else {
                        ctx.resume().then(() => {
                            if (ctx.state === 'running') begin();
                        }).catch(() => {});
                    }
                },
                stop() {
                    playing = false;
                    clearTimeout(loopTimer);
                    if (ctx) ctx.suspend();
                }
            };
        })();

        // Autoplay: try immediately; if the browser blocks it, start on first interaction.
        function tryStart() {
            music.start();
        }
        tryStart();
        ['pointerdown', 'keydown', 'touchstart'].forEach((evt) =>
            window.addEventListener(evt, tryStart, { once: true, capture: true }),
        );
    </script>
</body>
</html>
