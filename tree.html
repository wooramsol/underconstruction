<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="An interactive 3D ASCII Christmas tree made of letters, with music. Drag to rotate. By Ramsol Jeong (정우람솔, wooramsol).">
    <link rel="canonical" href="https://wooramsol.com/tree.html">
    <link rel="icon" href="favicon.png" type="image/png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Ramsol's Repository">
    <meta property="og:url" content="https://wooramsol.com/tree.html">
    <meta property="og:title" content="ASCII Christmas Tree — Ramsol Jeong (정우람솔)">
    <meta property="og:description" content="An interactive 3D ASCII Christmas tree made of letters, with music. Drag to rotate. By Ramsol Jeong (정우람솔, wooramsol).">
    <meta property="og:image" content="https://wooramsol.com/og.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ASCII Christmas Tree — Ramsol Jeong (정우람솔)</title>
    <style>
        body {
            margin: 0;
            background: #010301;
            overflow: hidden;
            font-family: 'Courier New', monospace;
            touch-action: none; 
        }
        canvas { 
            display: block;
            width: 100%;
            height: 100%;
            outline: none;
        }
    </style>
</head>
<body>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        let scene, camera, renderer, treeGroup, starGroup, font, controls;
        const glyphCache = {};
        let starMeshes = [];

        const chars = ['R', 'A', 'M', 'S', 'O', 'L' , '*'];
        const starChars = ['*'];

        const BG_COLOR = new THREE.Color(0x010301); 
        const COLOR_BOTTOM = new THREE.Color(0x0f400f); 
        const COLOR_TOP = new THREE.Color(0xaaffaa);
        
        const STAR_COLOR_YELLOW = new THREE.Color(0xffff00);
        const STAR_COLOR_WHITE = new THREE.Color(0xffffff);

        init();

        function init() {
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x010301, 0.035);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0.5, 14);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setClearColor(BG_COLOR, 1); 
            document.body.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            
            controls.enablePan = true;
            controls.screenSpacePanning = true;

            controls.mouseButtons = {
                LEFT: THREE.MOUSE.ROTATE,
                MIDDLE: THREE.MOUSE.PAN,
                RIGHT: THREE.MOUSE.DOLLY
            };

            controls.touches = {
                ONE: THREE.TOUCH.ROTATE,
                TWO: THREE.TOUCH.DOLLY_PAN
            };

            controls.minDistance = 5;
            controls.maxDistance = 30;

            treeGroup = new THREE.Group();
            treeGroup.position.y = 0.8; 
            scene.add(treeGroup);

            const loader = new THREE.FontLoader();
            loader.load('https://unpkg.com/three@0.128.0/examples/fonts/helvetiker_regular.typeface.json', (f) => {
                font = f;
                createExtraSpikyTree();
                createOptimizedStar();
                animate();
            });

            window.addEventListener('resize', onResize);
        }

        // One text geometry per character (built once), drawn with InstancedMesh.
        // Previously every letter was its own mesh + material (~9,000 draw calls), which froze/crashed phones.
        function glyph(char, depth, centered) {
            const key = char + depth + centered;
            if (!glyphCache[key]) {
                const g = new THREE.TextGeometry(char, { font: font, size: 1, height: depth, curveSegments: 3 }); // letters are only a few px tall
                if (centered) g.center();
                glyphCache[key] = g;
            }
            return glyphCache[key];
        }

        function buildInstanced(parent, items, depth, centered) {
            // items: [{char, x, y, z, rotY, size, color}]
            const byChar = {};
            items.forEach((it) => (byChar[it.char] = byChar[it.char] || []).push(it));
            const meshes = [];
            const m = new THREE.Matrix4(), q = new THREE.Quaternion(), p = new THREE.Vector3(), sc = new THREE.Vector3();
            const up = new THREE.Vector3(0, 1, 0);
            Object.keys(byChar).forEach((char) => {
                const list = byChar[char];
                const mesh = new THREE.InstancedMesh(glyph(char, depth, centered), new THREE.MeshBasicMaterial({ color: 0xffffff }), list.length);
                list.forEach((it, i) => {
                    p.set(it.x, it.y, it.z);
                    q.setFromAxisAngle(up, it.rotY || 0);
                    sc.set(it.size, it.size, it.size);
                    m.compose(p, q, sc);
                    mesh.setMatrixAt(i, m);
                    mesh.setColorAt(i, it.color);
                });
                mesh.instanceMatrix.needsUpdate = true;
                mesh.instanceColor.needsUpdate = true;
                mesh.userData.items = list;
                parent.add(mesh);
                meshes.push(mesh);
            });
            return meshes;
        }

        function createExtraSpikyTree() {
            const isMobile = Math.min(window.innerWidth, window.innerHeight) < 600;
            const particleCount = isMobile ? 7000 : 10000;
            const treeHeight = 8.5;
            const maxRadius = 4.0;
            const items = [];
            // depth is relative to size 1 (original: height 0.01 at size ~0.12)
            const depth = 0.01 / 0.12;

            for (let i = 0; i < particleCount; i++) {
                const ratio = Math.random();
                let heightDistribution = Math.pow(ratio, 2.0);

                if (heightDistribution < 0.15 && Math.random() > heightDistribution * 4.0) {
                    continue;
                }

                const y = (heightDistribution * treeHeight) - (treeHeight / 2);
                const baseConeRadius = maxRadius * (1 - heightDistribution);
                const theta = Math.random() * Math.PI * 2;

                let spikeFactor = 1.0;
                if (Math.random() > 0.7) {
                    spikeFactor = (0.9 + Math.random() * 0.2) + (Math.random() * 0.5 * (1.0 - heightDistribution));
                }

                const r = baseConeRadius * Math.sqrt(Math.random()) * spikeFactor;
                const char = chars[Math.floor(Math.random() * chars.length)];
                const size = 0.11 + (Math.random() * 0.02);

                let alpha = THREE.MathUtils.smoothstep(heightDistribution, 0.0, 0.25);
                alpha = 0.1 + alpha * 0.9;

                let baseColor = COLOR_BOTTOM.clone().lerp(COLOR_TOP, heightDistribution);
                baseColor.lerp(BG_COLOR, 1.0 - alpha);

                const hsl = {};
                baseColor.getHSL(hsl);
                hsl.h += (Math.random() - 0.5) * 0.08;
                hsl.s += (Math.random() - 0.5) * 0.5;
                hsl.l += 0.1 + (Math.random() - 0.5) * 0.6 * alpha;
                baseColor.setHSL(hsl.h, hsl.s, hsl.l);
                // stand-in for the old per-letter opacity: fade toward the background
                baseColor.lerp(BG_COLOR, 1.0 - alpha);

                items.push({ char, x: Math.cos(theta) * r, y, z: Math.sin(theta) * r, rotY: -theta, size, color: baseColor });
            }
            buildInstanced(treeGroup, items, depth, false);
        }

        function createOptimizedStar() {
            starGroup = new THREE.Group();
            const centerY = 4.8;
            const outerRadius = 0.65;
            const innerRadius = 0.28;
            const thicknessFactor = 0.15;

            const vertices = [];
            const numPoints = 5;
            for (let i = 0; i < numPoints * 2; i++) {
                const angle = (Math.PI / 2) + (i * Math.PI / numPoints);
                const r = (i % 2 === 0) ? outerRadius : innerRadius;
                vertices.push({ x: Math.cos(angle) * r, y: centerY + Math.sin(angle) * r });
            }

            const items = [];
            const fillCount = 600;
            let attempts = 0;
            while (items.length < fillCount && attempts < 10000) {
                attempts++;
                const rx = (Math.random() - 0.5) * 2 * outerRadius;
                const ry = centerY + (Math.random() - 0.5) * 2 * outerRadius;

                if (isPointInPolygon(rx, ry, vertices)) {
                    const dist = Math.sqrt(rx * rx + (ry - centerY) * (ry - centerY));
                    const distRatio = dist / outerRadius;
                    const currentMaxZ = (1.0 - distRatio) * thicknessFactor;
                    const rz = (Math.random() - 0.5) * 2 * currentMaxZ;
                    const size = 0.08 + (1.0 - distRatio) * 0.06 + Math.random() * 0.04;
                    const char = starChars[Math.floor(Math.random() * starChars.length)];
                    const color = (Math.random() > 0.05) ? STAR_COLOR_YELLOW.clone() : STAR_COLOR_WHITE.clone();
                    const hsl = {};
                    color.getHSL(hsl);
                    items.push({ char, x: rx, y: ry, z: rz, size, color, hsl });
                }
            }
            starMeshes = buildInstanced(starGroup, items, 0.02 / 0.11, true);
            treeGroup.add(starGroup);
        }

        function isPointInPolygon(x, y, vs) {
            let inside = false;
            for (let i = 0, j = vs.length - 1; i < vs.length; j = i++) {
                const xi = vs[i].x, yi = vs[i].y;
                const xj = vs[j].x, yj = vs[j].y;
                const intersect = ((yi > y) !== (yj > y)) &&
                    (x < (xj - xi) * (y - yi) / (yj - yi) + xi);
                if (intersect) inside = !inside;
            }
            return inside;
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            treeGroup.rotation.y += 0.008; 
            
            if (starGroup) {
                starGroup.rotation.y -= 0.016;

                const time = Date.now() * 0.004;
                const c = new THREE.Color();
                let index = 0;
                starMeshes.forEach((mesh) => {
                    mesh.userData.items.forEach((it, i) => {
                        const offset = index++ * 0.5;
                        const wave = Math.sin(time * 0.7 + offset);
                        const flash = Math.pow(Math.abs(wave), 5);
                        c.setHSL(it.hsl.h, it.hsl.s, Math.min(1.0, flash * 3.0));
                        mesh.setColorAt(i, c);
                    });
                    mesh.instanceColor.needsUpdate = true;
                });
            }

            renderer.render(scene, camera);
        }

        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        }

        // --- Christmas music: "We Wish You a Merry Christmas" (public-domain melody, WebAudio chiptune) ---
        const music = (() => {
            const N = { D4: 293.66, E4: 329.63, Fs4: 369.99, G4: 392.0, A4: 440.0, B4: 493.88, C5: 523.25 };
            // [frequency, beats] in 3/4 time
            const MELODY = [
                [N.D4, 1],
                [N.G4, 1], [N.G4, 0.5], [N.A4, 0.5], [N.G4, 0.5], [N.Fs4, 0.5],
                [N.E4, 1], [N.E4, 1], [N.E4, 1],
                [N.A4, 1], [N.A4, 0.5], [N.B4, 0.5], [N.A4, 0.5], [N.G4, 0.5],
                [N.Fs4, 1], [N.Fs4, 1], [N.D4, 1],
                [N.B4, 1], [N.B4, 0.5], [N.C5, 0.5], [N.B4, 0.5], [N.A4, 0.5],
                [N.G4, 1], [N.E4, 1], [N.D4, 0.5], [N.D4, 0.5],
                [N.E4, 1], [N.A4, 1], [N.Fs4, 1],
                [N.G4, 2], [0, 1.5]
            ];
            const BEAT = 0.34;
            let ctx = null;
            let playing = false;
            let loopTimer = null;

            function note(t, freq, beats) {
                if (!freq) return;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.value = freq;
                const dur = beats * BEAT;
                gain.gain.setValueAtTime(0, t);
                gain.gain.linearRampToValueAtTime(0.16, t + 0.02);
                gain.gain.exponentialRampToValueAtTime(0.001, t + dur * 0.95);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(t);
                osc.stop(t + dur);
            }

            function scheduleMelody() {
                let t = ctx.currentTime + 0.02;
                for (const [f, b] of MELODY) {
                    note(t, f, b);
                    t += b * BEAT;
                }
                loopTimer = setTimeout(() => { if (playing) scheduleMelody(); }, (t - ctx.currentTime - 0.2) * 1000);
            }

            return {
                get playing() { return playing; },
                start() {
                    if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
                    const begin = () => {
                        if (playing) return;
                        playing = true;
                        scheduleMelody();
                    };
                    // Safari: only schedule notes once the context is actually running,
                    // otherwise pre-scheduled notes resume late/unreliably.
                    if (ctx.state === 'running') {
                        begin();
                    } else {
                        ctx.resume().then(() => {
                            if (ctx.state === 'running') begin();
                        }).catch(() => {});
                    }
                },
                stop() {
                    playing = false;
                    clearTimeout(loopTimer);
                    if (ctx) ctx.suspend();
                }
            };
        })();

        // Autoplay: try immediately; if the browser blocks it, start on first interaction.
        function tryStart() {
            music.start();
        }
        tryStart();
        ['pointerdown', 'keydown', 'touchstart'].forEach((evt) =>
            window.addEventListener(evt, tryStart, { once: true }),
        );
    </script>
</body>
</html>
