<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="An interactive 3D Christmas tree made of letters. Type any word in English or 한글 and the tree rebuilds from your letters in real time. By Ramsol Jeong (정우람솔, wooramsol).">
    <link rel="canonical" href="https://wooramsol.com/tree.html">
    <link rel="icon" href="favicon.png" type="image/png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Ramsol's Repository">
    <meta property="og:url" content="https://wooramsol.com/tree.html">
    <meta property="og:title" content="ASCII Christmas Tree — Ramsol Jeong (정우람솔)">
    <meta property="og:description" content="An interactive 3D Christmas tree made of letters. Type any word in English or 한글 and the tree rebuilds from your letters in real time. By Ramsol Jeong (정우람솔, wooramsol).">
    <meta property="og:image" content="https://wooramsol.com/og.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ASCII Christmas Tree — Ramsol Jeong (정우람솔)</title>
    <style>
        body {
            margin: 0;
            background: #010301;
            overflow: hidden;
            font-family: 'Courier New', monospace;
            touch-action: none; 
        }
        canvas { 
            display: block;
            width: 100%;
            height: 100%;
            outline: none;
        }
        #tree-text-wrap {
            position: fixed;
            left: 50%;
            bottom: max(24px, env(safe-area-inset-bottom));
            transform: translateX(-50%);
            z-index: 10;
            width: min(320px, calc(100vw - 40px));
        }
        #tree-text {
            width: 100%;
            box-sizing: border-box;
            padding: 10px 14px;
            font-size: 16px; /* 16px+ stops iOS from zooming on focus */
            font-family: inherit;
            text-align: center;
            color: #aaffaa;
            background: rgba(1, 3, 1, 0.75);
            border: 1px solid #0f400f;
            border-radius: 6px;
            outline: none;
        }
        #tree-text:focus { border-color: #aaffaa; }
        #tree-text::placeholder { color: #3f7f3f; font-size: 14px; }
    </style>
</head>
<body>
    <div id="tree-text-wrap"><input id="tree-text" type="text" placeholder="Type letters to grow your tree" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" aria-label="Letters for the tree"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        let scene, camera, renderer, treeGroup, starGroup, controls;
        let treeItems = [];          // fixed positions/colors; only the letters change
        let treeMeshes = [];
        let starMeshes = [];
        const glyphTextures = {};

        const MAX_INPUT = 30;
        const EXAMPLE_TEXT = 'RAMSOL'; // only a pre-filled example on first load; an empty field = empty tree

        const BG_COLOR = new THREE.Color(0x010301);
        const COLOR_BOTTOM = new THREE.Color(0x0f400f);
        const COLOR_TOP = new THREE.Color(0xaaffaa);
        const STAR_COLOR_YELLOW = new THREE.Color(0xffff00);
        const STAR_COLOR_WHITE = new THREE.Color(0xffffff);

        function init() {
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x010301, 0.035);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0.5, 14);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setClearColor(BG_COLOR, 1);
            document.body.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.enablePan = true;
            controls.screenSpacePanning = true;
            controls.mouseButtons = { LEFT: THREE.MOUSE.ROTATE, MIDDLE: THREE.MOUSE.PAN, RIGHT: THREE.MOUSE.DOLLY };
            controls.touches = { ONE: THREE.TOUCH.ROTATE, TWO: THREE.TOUCH.DOLLY_PAN };
            controls.minDistance = 5;
            controls.maxDistance = 30;

            treeGroup = new THREE.Group();
            treeGroup.position.y = 0.8;
            scene.add(treeGroup);

            createTreeLayout();
            setTreeText(initialText());
            createOptimizedStar();
            setupInput();
            fitCamera();
            animate();

            window.addEventListener('resize', onResize);
        }

        // ---- Letters are drawn onto small canvases with the device's own fonts, so any
        //      language works (English, 한글, even emoji). Each distinct letter = one draw call.
        function glyphTexture(char) {
            if (glyphTextures[char]) return glyphTextures[char];
            const S = 128;
            const c = document.createElement('canvas');
            c.width = c.height = S;
            const g = c.getContext('2d');
            g.fillStyle = '#fff';
            g.textAlign = 'center';
            g.textBaseline = 'middle';
            g.font = `bold ${S * 0.82}px "Helvetica Neue", Arial, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif`;
            if (char === '.') {
                // a bare period sits on the baseline and is tiny; draw it as a centred dot instead
                g.beginPath(); g.arc(S / 2, S / 2, S * 0.11, 0, Math.PI * 2); g.fill();
            } else {
                g.fillText(char, S / 2, S / 2 + S * 0.04);
            }
            const tex = new THREE.CanvasTexture(c);
            tex.minFilter = THREE.LinearMipMapLinearFilter;
            tex.anisotropy = 4;
            glyphTextures[char] = tex;
            return tex;
        }

        const planeGeo = new THREE.PlaneGeometry(1, 1);
        const _m = new THREE.Matrix4(), _q = new THREE.Quaternion(), _p = new THREE.Vector3(), _s = new THREE.Vector3();
        const UP = new THREE.Vector3(0, 1, 0);

        function buildInstanced(parent, items) {
            // items: [{char, x, y, z, rotY, size, color}] -> one InstancedMesh per distinct char
            const byChar = new Map();
            items.forEach((it) => { if (!byChar.has(it.char)) byChar.set(it.char, []); byChar.get(it.char).push(it); });
            const meshes = [];
            byChar.forEach((list, char) => {
                const mat = new THREE.MeshBasicMaterial({ map: glyphTexture(char), color: 0xffffff, alphaTest: 0.35, side: THREE.DoubleSide });
                const mesh = new THREE.InstancedMesh(planeGeo, mat, list.length);
                list.forEach((it, i) => {
                    _p.set(it.x, it.y, it.z);
                    _q.setFromAxisAngle(UP, it.rotY || 0);
                    _s.set(it.size, it.size, it.size);
                    _m.compose(_p, _q, _s);
                    mesh.setMatrixAt(i, _m);
                    mesh.setColorAt(i, it.color);
                });
                mesh.instanceMatrix.needsUpdate = true;
                mesh.instanceColor.needsUpdate = true;
                mesh.userData.items = list;
                parent.add(mesh);
                meshes.push(mesh);
            });
            return meshes;
        }

        function disposeMeshes(list) {
            list.forEach((m) => { m.parent && m.parent.remove(m); m.material.dispose(); m.dispose && m.dispose(); });
        }

        // Positions and colors are generated once; typing only swaps which letter each spot shows.
        const TREE_H = 8.5, TREE_R = 4.0;

        // Each spot keeps its own random seeds for the whole session. The actual position is
        // recomputed from those seeds + a "complexity" value, so typing reshapes the tree smoothly
        // instead of reshuffling it.
        function createTreeLayout() {
            const isMobile = Math.min(window.innerWidth, window.innerHeight) < 600;
            const particleCount = isMobile ? 11000 : 16000; // upper bound; how many show depends on text length
            treeItems = [];
            for (let i = 0; i < particleCount; i++) {
                const h = Math.pow(Math.random(), 2.0);
                if (h < 0.15 && Math.random() > h * 4.0) continue;

                treeItems.push({
                    char: '.', h, color: new THREE.Color(),
                    cH: Math.random() - 0.5, cS: Math.random() - 0.5, cL: Math.random() - 0.5,
                    size: (0.11 + Math.random() * 0.02) * 1.25,
                    uTheta: Math.random(), uR: Math.random(), uSpike: Math.random(), uSpikeAmt: Math.random(),
                    uBranch: Math.random(), uBranchIdx: Math.random(), uJit: Math.random(), uDroop: Math.random(),
                    pick: Math.random(), rank: Math.random(),
                });
            }
        }

        // c = 0 (nothing typed) .. 1 (30 letters): more tiers, more branch arms, more spikes.
        // Random branches: generated once per visit (so every visitor gets a different tree).
        // More letters switch on more of them, so the tree gets wilder as you type.
        const MAX_BRANCHES = 140;
        const branches = [];
        for (let i = 0; i < MAX_BRANCHES; i++) {
            const hb = Math.pow(Math.random(), 1.25) * 0.9;              // where on the trunk it starts
            branches.push({
                hb,
                theta: Math.random() * Math.PI * 2,                      // direction
                len: TREE_R * (1 - hb) * (0.5 + Math.random() * 0.7),    // some poke out a bit past the outline
                tilt: (Math.random() - 0.35) * 0.9,                      // mostly up, some sideways/down
                droop: Math.random() * 0.9,                              // how much the tip hangs
                curve: (Math.random() - 0.5) * 1.6,                      // sideways bend along its length
                twigs: Math.random(),                                    // how bushy
            });
        }

        // colour follows the spot's actual height (dark green at the bottom, light at the top)
        function colorFor(it, y) {
            const h = THREE.MathUtils.clamp((y + TREE_H / 2) / TREE_H, 0, 1);
            const alpha = 0.1 + THREE.MathUtils.smoothstep(h, 0.0, 0.25) * 0.9;
            const col = it.color.copy(COLOR_BOTTOM).lerp(COLOR_TOP, h).lerp(BG_COLOR, 1.0 - alpha);
            const hsl = {};
            col.getHSL(hsl);
            col.setHSL(hsl.h + it.cH * 0.08, hsl.s + it.cS * 0.5, hsl.l + 0.1 + it.cL * 0.6 * alpha);
            col.lerp(BG_COLOR, 1.0 - alpha);
        }

        // c = 0 (nothing typed) .. 1 (30 letters)
        function placeItem(it, c) {
            const active = Math.round(8 + c * (MAX_BRANCHES - 8));
            const bi = Math.floor(it.uBranchIdx * MAX_BRANCHES);
            const onBranch = it.uBranch < 0.2 + 0.55 * c && bi < active;

            let x, y, z, theta;
            if (onBranch) {
                const br = branches[bi];
                const s = Math.pow(it.uR, 0.8);                          // position along the branch (0 = trunk)
                const len = br.len * s;
                theta = br.theta + br.curve * s * s;
                const by = (br.hb * TREE_H - TREE_H / 2) + len * br.tilt - br.droop * s * s;
                // twigs: scatter around the branch line, more towards the tip
                const spread = (0.08 + 0.35 * br.twigs) * s;
                const a = it.uJit * Math.PI * 2;
                const off = spread * Math.sqrt(it.uDroop);
                const r = 0.15 + len;
                x = Math.cos(theta) * r + Math.cos(a) * off * Math.sin(theta);
                z = Math.sin(theta) * r - Math.cos(a) * off * Math.cos(theta);
                y = by + Math.sin(a) * off;
            } else {
                // soft cone body
                const h = it.h;
                theta = it.uTheta * Math.PI * 2;
                let r = TREE_R * (1 - h) * Math.sqrt(it.uR) * (0.9 - 0.3 * c);
                if (it.uSpike > 0.7) r *= (0.9 + it.uSpikeAmt * 0.2) + it.uSpikeAmt * 0.5 * (1.0 - h);
                x = Math.cos(theta) * r;
                z = Math.sin(theta) * r;
                y = h * TREE_H - TREE_H / 2;
            }
            it.x = x; it.y = y; it.z = z;
            colorFor(it, y);
            it.rotY = -theta;
        }

        function textToChars(text) {
            return Array.from((text || '').replace(/\s+/g, '')).slice(0, MAX_INPUT);
        }

        function setTreeText(text) {
            const chars = textToChars(text);
            // More letters -> denser, more branches, more complex. The size on screen stays the same.
            // Nothing typed -> a sparse, simple tree made of '.' only.
            const c = Math.sqrt(Math.min(chars.length, MAX_INPUT) / MAX_INPUT); // 0..1
            const density = 0.35 + 0.65 * c;  // share of the pre-generated spots that are shown
            const glyphs = chars.length ? chars : ['.'];
            const shown = treeItems.filter((it) => it.rank < density);
            shown.forEach((it) => { placeItem(it, c); it.char = glyphs[Math.floor(it.pick * glyphs.length)]; });
            disposeMeshes(treeMeshes);
            treeMeshes = buildInstanced(treeGroup, shown);
        }

        // Fit the whole tree (incl. star, above the text field) to the screen; same size whatever is typed.
        function fitCamera() {
            const top = 0.8 + 4.8 + 0.7;            // star top (treeGroup is raised by 0.8)
            const bottom = 0.8 - TREE_H / 2 - 0.6;  // lowest drooping tips
            const halfW = TREE_R * 1.15;
            const reserve = 1.6;                    // room for the text field at the bottom
            const halfH = (top - bottom + reserve) / 2;
            const centerY = (top + bottom - reserve) / 2;
            const tanHalf = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
            const dist = Math.max(halfH / tanHalf, halfW / (tanHalf * camera.aspect)) * 1.04;
            controls.target.set(0, centerY, 0);
            camera.position.set(0, centerY, dist);
            controls.maxDistance = Math.max(30, dist * 1.5);
            controls.update();
        }

        function createOptimizedStar() {
            starGroup = new THREE.Group();
            const centerY = 4.8, outerRadius = 0.65, innerRadius = 0.28, thicknessFactor = 0.15;
            const vertices = [];
            for (let i = 0; i < 10; i++) {
                const angle = (Math.PI / 2) + (i * Math.PI / 5);
                const r = (i % 2 === 0) ? outerRadius : innerRadius;
                vertices.push({ x: Math.cos(angle) * r, y: centerY + Math.sin(angle) * r });
            }
            const items = [];
            let attempts = 0;
            while (items.length < 600 && attempts < 10000) {
                attempts++;
                const rx = (Math.random() - 0.5) * 2 * outerRadius;
                const ry = centerY + (Math.random() - 0.5) * 2 * outerRadius;
                if (!isPointInPolygon(rx, ry, vertices)) continue;
                const distRatio = Math.sqrt(rx * rx + (ry - centerY) * (ry - centerY)) / outerRadius;
                const rz = (Math.random() - 0.5) * 2 * (1.0 - distRatio) * thicknessFactor;
                const size = (0.08 + (1.0 - distRatio) * 0.06 + Math.random() * 0.04) * 1.3;
                const color = (Math.random() > 0.05) ? STAR_COLOR_YELLOW.clone() : STAR_COLOR_WHITE.clone();
                const hsl = {};
                color.getHSL(hsl);
                // random facing so the flat glyphs never all turn edge-on together while the star spins
                items.push({ char: '*', x: rx, y: ry, z: rz, rotY: Math.random() * Math.PI, size, color, hsl });
            }
            starMeshes = buildInstanced(starGroup, items);
            treeGroup.add(starGroup);
        }

        function isPointInPolygon(x, y, vs) {
            let inside = false;
            for (let i = 0, j = vs.length - 1; i < vs.length; j = i++) {
                const xi = vs[i].x, yi = vs[i].y, xj = vs[j].x, yj = vs[j].y;
                if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) inside = !inside;
            }
            return inside;
        }

        // ---- Text field: live rebuild while typing; the text is kept in the URL (?text=) so a tree can be shared.
        function initialText() {
            try {
                const q = new URLSearchParams(location.search);
                return q.has('text') ? q.get('text') : EXAMPLE_TEXT;
            } catch (e) { return EXAMPLE_TEXT; }
        }

        function setupInput() {
            const input = document.getElementById('tree-text');
            input.maxLength = MAX_INPUT * 2;
            input.value = initialText();
            let timer = 0;
            const apply = () => {
                setTreeText(input.value);
                try {
                    const url = new URL(location.href);
                    const v = input.value.trim();
                    if (v === EXAMPLE_TEXT) url.searchParams.delete('text'); // clean URL for the example
                    else url.searchParams.set('text', v);                   // '' is kept too, so a reload stays empty
                    history.replaceState(null, '', url);
                } catch (e) {}
            };
            // 'input' fires per keystroke; for Korean IME also on composition updates, so 한글 grows live too
            input.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(apply, 120); });
            // keep the 3D controls from reacting while typing
            ['pointerdown', 'touchstart', 'keydown'].forEach((e) => input.addEventListener(e, (ev) => ev.stopPropagation()));
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            treeGroup.rotation.y += 0.008;

            if (starGroup) {
                starGroup.rotation.y -= 0.016;
                const time = Date.now() * 0.004;
                const c = new THREE.Color();
                let index = 0;
                starMeshes.forEach((mesh) => {
                    mesh.userData.items.forEach((it, i) => {
                        const flash = Math.pow(Math.abs(Math.sin(time * 0.7 + index++ * 0.5)), 5);
                        c.setHSL(it.hsl.h, it.hsl.s, Math.min(1.0, flash * 3.0));
                        mesh.setColorAt(i, c);
                    });
                    mesh.instanceColor.needsUpdate = true;
                });
            }

            renderer.render(scene, camera);
        }

        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            fitCamera();
        }

        init(); // run after all declarations above

        // --- Christmas music: "We Wish You a Merry Christmas" (public-domain melody, WebAudio chiptune) ---
        const music = (() => {
            const N = { D4: 293.66, E4: 329.63, Fs4: 369.99, G4: 392.0, A4: 440.0, B4: 493.88, C5: 523.25 };
            // [frequency, beats] in 3/4 time
            const MELODY = [
                [N.D4, 1],
                [N.G4, 1], [N.G4, 0.5], [N.A4, 0.5], [N.G4, 0.5], [N.Fs4, 0.5],
                [N.E4, 1], [N.E4, 1], [N.E4, 1],
                [N.A4, 1], [N.A4, 0.5], [N.B4, 0.5], [N.A4, 0.5], [N.G4, 0.5],
                [N.Fs4, 1], [N.Fs4, 1], [N.D4, 1],
                [N.B4, 1], [N.B4, 0.5], [N.C5, 0.5], [N.B4, 0.5], [N.A4, 0.5],
                [N.G4, 1], [N.E4, 1], [N.D4, 0.5], [N.D4, 0.5],
                [N.E4, 1], [N.A4, 1], [N.Fs4, 1],
                [N.G4, 2], [0, 1.5]
            ];
            const BEAT = 0.34;
            let ctx = null;
            let playing = false;
            let loopTimer = null;

            function note(t, freq, beats) {
                if (!freq) return;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.value = freq;
                const dur = beats * BEAT;
                gain.gain.setValueAtTime(0, t);
                gain.gain.linearRampToValueAtTime(0.16, t + 0.02);
                gain.gain.exponentialRampToValueAtTime(0.001, t + dur * 0.95);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(t);
                osc.stop(t + dur);
            }

            function scheduleMelody() {
                let t = ctx.currentTime + 0.02;
                for (const [f, b] of MELODY) {
                    note(t, f, b);
                    t += b * BEAT;
                }
                loopTimer = setTimeout(() => { if (playing) scheduleMelody(); }, (t - ctx.currentTime - 0.2) * 1000);
            }

            return {
                get playing() { return playing; },
                start() {
                    if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
                    const begin = () => {
                        if (playing) return;
                        playing = true;
                        scheduleMelody();
                    };
                    // Safari: only schedule notes once the context is actually running,
                    // otherwise pre-scheduled notes resume late/unreliably.
                    if (ctx.state === 'running') {
                        begin();
                    } else {
                        ctx.resume().then(() => {
                            if (ctx.state === 'running') begin();
                        }).catch(() => {});
                    }
                },
                stop() {
                    playing = false;
                    clearTimeout(loopTimer);
                    if (ctx) ctx.suspend();
                }
            };
        })();

        // Autoplay: try immediately; if the browser blocks it, start on first interaction.
        function tryStart() {
            music.start();
        }
        tryStart();
        ['pointerdown', 'keydown', 'touchstart'].forEach((evt) =>
            window.addEventListener(evt, tryStart, { once: true, capture: true }),
        );
    </script>
</body>
</html>
